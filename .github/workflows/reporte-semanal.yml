name: Reporte Semanal ECO

on:
  schedule:
    # Viernes 3:00pm hora Mexico City (UTC-6) = 21:00 UTC
    - cron: '0 21 * * 5'
  # Permite ejecutarlo manualmente desde GitHub Actions
  workflow_dispatch:

jobs:
  enviar-reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar reporte semanal
        run: |
          curl -f -X POST "${{ secrets.APP_URL }}/admin/reportes/cron/reporte-semanal" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 30
