# Guardrail de imports — NO es un linter de estilo completo.
# Solo detecta problemas de imports/simbolos que /simplify puede introducir.
exclude = ["venv", ".venv", "migrations", "alembic", "node_modules"]

[lint]
select = ["F401", "F811", "F821"]
#   F401 = import sin usar (simplify deja imports muertos)
#   F811 = redefinicion / shadowing
#   F821 = nombre no definido  <- atrapa el import faltante

[lint.per-file-ignores]
"__init__.py" = ["F401"]   # re-exports intencionales
