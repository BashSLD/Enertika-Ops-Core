<div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90dvh] flex flex-col relative">

    <button onclick="document.getElementById('modal-config-bom').classList.add('hidden')"
        class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 p-2 rounded-full hover:bg-gray-100">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
    </button>

    <div class="p-6 border-b">
        <h2 class="text-xl font-bold text-gray-900">Aprobaciones del BOM</h2>
        <p class="text-sm text-gray-500 mt-1">Controla quien puede aprobar cada paso del workflow.</p>
    </div>

    <div class="flex-1 min-h-0 overflow-y-auto p-6 space-y-6">

        <!-- Flags booleanas -->
        <form hx-post="/admin/config-bom-aprobaciones/guardar"
              hx-target="#toast-container"
              hx-swap="afterbegin"
              class="space-y-4">

            <div class="border rounded-lg p-4 space-y-4">
                <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wide">Workflow BOM</h3>

                <label class="flex items-start gap-3 cursor-pointer">
                    <input type="checkbox" name="bom_gestion" value="true"
                           {% if bom_gestion %}checked{% endif %}
                           class="mt-0.5 h-4 w-4 rounded border-gray-300 text-teal-600 focus:ring-teal-500">
                    <span>
                        <span class="block text-sm font-medium text-gray-900">Exigir responsable por proyecto</span>
                        <span class="block text-xs text-gray-500">Solo el RI / Coordinador de Obra / Jefe de Construccion asignado al proyecto puede aprobar su paso. Si esta desactivado, cualquier jefe del area puede aprobar cualquier proyecto.</span>
                    </span>
                </label>

                <label class="flex items-start gap-3 cursor-pointer">
                    <input type="checkbox" name="bom_director" value="true"
                           {% if bom_director %}checked{% endif %}
                           class="mt-0.5 h-4 w-4 rounded border-gray-300 text-teal-600 focus:ring-teal-500">
                    <span>
                        <span class="block text-sm font-medium text-gray-900">Permitir que Direccion apruebe como respaldo</span>
                        <span class="block text-xs text-gray-500">El Director puede aprobar cualquier paso intermedio (Ing / Obra / Const) independientemente del responsable asignado.</span>
                    </span>
                </label>
            </div>

            <div class="border rounded-lg p-4 space-y-4">
                <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wide">Equipo de Proyecto</h3>

                <label class="flex items-start gap-3 cursor-pointer">
                    <input type="checkbox" name="equipo_gestion" value="true"
                           {% if equipo_gestion %}checked{% endif %}
                           class="mt-0.5 h-4 w-4 rounded border-gray-300 text-teal-600 focus:ring-teal-500">
                    <span>
                        <span class="block text-sm font-medium text-gray-900">Exigir responsable para gestion de equipo (RC/RI)</span>
                        <span class="block text-xs text-gray-500">Solo el RC o RI asignado puede gestionar el equipo de su area. Si esta desactivado, cualquier jefe del area puede hacerlo.</span>
                    </span>
                </label>

                <label class="flex items-start gap-3 cursor-pointer">
                    <input type="checkbox" name="equipo_autoasign" value="true"
                           {% if equipo_autoasign %}checked{% endif %}
                           class="mt-0.5 h-4 w-4 rounded border-gray-300 text-teal-600 focus:ring-teal-500">
                    <span>
                        <span class="block text-sm font-medium text-gray-900">Autoasignacion de RC por jefes de area</span>
                        <span class="block text-xs text-gray-500">Al asignar coordinador de obra, el jefe de Construccion queda autoasignado como RC del proyecto.</span>
                    </span>
                </label>
            </div>

            <div class="flex justify-end">
                <button type="submit"
                        class="px-4 py-2 bg-teal-600 text-white text-sm font-medium rounded-lg hover:bg-teal-700">
                    Guardar configuracion
                </button>
            </div>
        </form>

        <!-- Aprobador final (form separado — endpoint BOM existente) -->
        <div class="border rounded-lg p-4">
            <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wide mb-1">Aprobador final del BOM</h3>
            <p class="text-xs text-gray-500 mb-3">Usuario unico que aprueba el paso final. Sin bypass, incluso para ADMIN.</p>
            <form hx-post="/bom/admin/aprobador-final"
                  hx-target="#toast-container"
                  hx-swap="afterbegin"
                  class="flex gap-2">
                <select name="user_id"
                        class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
                    <option value="">— Sin configurar —</option>
                    {% for u in usuarios %}
                    <option value="{{ u.id_usuario }}"
                            {% if aprobador_final_id == u.id_usuario|string %}selected{% endif %}>
                        {{ u.nombre }}
                    </option>
                    {% endfor %}
                </select>
                <button type="submit"
                        class="px-4 py-2 bg-gray-700 text-white text-sm font-medium rounded-lg hover:bg-gray-800">
                    Guardar
                </button>
            </form>
        </div>

    </div>
</div>
