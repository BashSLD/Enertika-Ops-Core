{% if error %}
<div data-chunk-index="{{ chunk_index }}" data-has-error="true"
  class="flex items-start gap-2 text-xs bg-red-50 border border-red-200 rounded px-3 py-2">
  <span class="text-red-500 font-bold mt-0.5">✗</span>
  <div>
    <span class="font-medium text-red-700">{{ chunk_label }}</span>
    <span class="text-red-600 ml-1">— {{ error }}</span>
  </div>
</div>
{% else %}
<div data-chunk-index="{{ chunk_index }}"
  class="flex items-start gap-2 text-xs bg-green-50 border border-green-200 rounded px-3 py-2">
  <span class="text-green-600 font-bold mt-0.5">✓</span>
  <div class="flex flex-wrap gap-x-3 gap-y-0.5">
    <span class="font-medium text-green-800">{{ chunk_label }}</span>
    <span class="text-gray-600">{{ records_inserted }} importadas</span>
    {% if records_skipped > 0 %}
    <span class="text-gray-400">{{ records_skipped }} omitidas</span>
    {% endif %}
    <span class="text-gray-500">{{ targets_recalculated }} días recalculados</span>
  </div>
</div>
{% endif %}
