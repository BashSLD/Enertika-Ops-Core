{% from "shared/partials/_spinner_overlay.html" import spinner_icon %}

<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4"
     x-data="{ enviando: false, archivos: [] }"
     @keydown.escape.window="$el.remove()">
  <div class="relative w-full max-w-md rounded-2xl bg-white shadow-xl">
    <div x-show="enviando" x-cloak
         class="absolute inset-0 z-10 flex flex-col items-center justify-center gap-2 rounded-2xl bg-white/80">
      {{ spinner_icon('h-6 w-6', 'text-[#00BABB]') }}
      <span class="text-xs font-medium text-gray-500">Enviando solicitud...</span>
    </div>
    <div class="flex items-center justify-between border-b border-gray-100 px-5 py-4">
      <h3 class="text-sm font-semibold text-gray-800">Solicitar aprobación de horas extra</h3>
      <button type="button" class="text-gray-400 hover:text-gray-600" @click="$root.remove()">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <form hx-post="/asistencia/api/horas-extra/{{ asistencia_id }}/solicitar"
          hx-encoding="multipart/form-data"
          hx-target="#he-solicitud-modal"
          hx-swap="innerHTML"
          @htmx:before-request="enviando = true"
          @htmx:after-request="enviando = false"
          class="space-y-4 px-5 py-4">
      <div class="rounded-lg border border-[#00BABB]/20 bg-[#00BABB]/10 px-3 py-2 text-xs text-[#007C7D]">
        {{ fecha_laboral.strftime('%d/%m/%Y') }} &middot; <strong>+{{ extra_fmt }} extra</strong>
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-gray-600">Motivo</label>
        <textarea name="motivo" rows="3" required :disabled="enviando"
                  placeholder="Motivo de las horas extra..."
                  class="w-full resize-none rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-[#00BABB] focus:ring-[#00BABB]"></textarea>
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-gray-600">Evidencia (opcional)</label>
        <input type="file" name="evidencias" multiple accept="application/pdf,image/*" :disabled="enviando"
               x-ref="fileInput" class="hidden"
               @change="archivos = Array.from($event.target.files)">
        <button type="button" :disabled="enviando" @click="$refs.fileInput.click()"
                class="inline-flex items-center gap-1.5 rounded-lg border border-[#00BABB] bg-[#00BABB]/10 px-3 py-1.5 text-xs font-semibold text-[#007C7D] hover:bg-[#00BABB]/20 transition-colors disabled:pointer-events-none disabled:opacity-50">
          <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/>
          </svg>
          Seleccionar archivo
        </button>
        <p class="mt-1 text-xs text-gray-400">Formato PDF o imagen.</p>
        <template x-if="archivos.length">
          <ul class="mt-2 space-y-1">
            <template x-for="(archivo, idx) in archivos" :key="idx">
              <li class="flex items-center justify-between gap-2 rounded-lg bg-[#00BABB]/10 px-2.5 py-1.5">
                <span class="truncate text-xs font-medium text-[#007C7D]" x-text="archivo.name"></span>
                <button type="button" :disabled="enviando"
                        @click="const dt = new DataTransfer(); archivos.filter((_, i) => i !== idx).forEach(f => dt.items.add(f)); $refs.fileInput.files = dt.files; archivos = Array.from($refs.fileInput.files);"
                        class="flex-shrink-0 text-gray-400 hover:text-red-500 disabled:pointer-events-none">
                  <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                  </svg>
                </button>
              </li>
            </template>
          </ul>
        </template>
      </div>
      <div class="flex justify-end gap-2 border-t border-gray-100 pt-4">
        <button type="submit" :disabled="enviando" :class="enviando ? 'cursor-wait opacity-75' : ''"
                class="inline-flex items-center gap-1.5 rounded-lg bg-[#00BABB] px-4 py-2 text-sm font-semibold text-white hover:bg-[#009899] disabled:pointer-events-none">
          {{ spinner_icon('h-4 w-4', '', '', 'x-show="enviando" x-cloak') }}
          <span x-text="enviando ? 'Enviando...' : 'Enviar'">Enviar</span>
        </button>
      </div>
    </form>
  </div>
</div>
