{% macro icono_caja(css_class='w-5 h-5', stroke_width='1.5') %}
<svg class="{{ css_class }}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="{{ stroke_width }}" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
</svg>
{% endmacro %}

{% macro boton_adjudicar(cotizacion_id, lock_version, confirm_msg, css_class) %}
<button type="button"
    hx-post="/bom/cotizaciones/{{ cotizacion_id }}/seleccionar"
    hx-vals='{"lock_version": "{{ lock_version }}"}'
    hx-target="#tab-cotizaciones" hx-swap="innerHTML"
    hx-confirm="{{ confirm_msg }}"
    title="Marca esta cotización como la elegida, actualiza los ítems cubiertos y genera la autorización de compra para el coordinador de obra."
    class="{{ css_class }}">
    Adjudicar
</button>
{% endmacro %}
