{% from "shared/partials/_spinner_overlay.html" import spinner_icon %}

<div id="modal-aceptar-cotizacion"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm"
     x-data="{
         fechaInicio: '{{ fecha_hoy }}',
         fechaFin: '',
         cerrar() { document.getElementById('modal-aceptar-cotizacion')?.remove(); }
     }"
     @keydown.escape.window="cerrar()">

    <div
         class="bg-white rounded-xl shadow-2xl w-full max-w-sm mx-4"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100">

        {# Header #}
        <div class="px-5 py-4 border-b border-gray-200 flex items-center justify-between">
            <div>
                <h3 class="font-semibold text-gray-800 text-base">Aceptar poliza</h3>
                <p class="text-xs text-gray-500 mt-0.5">{{ cotizacion.nombre_planta }}</p>
            </div>
            <button @click="cerrar()"
                    class="text-gray-400 hover:text-gray-600 p-1.5 rounded-lg hover:bg-gray-100 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        {# Formulario #}
        <form id="form-aceptar-cotizacion"
              hx-patch="/oym/cotizaciones/{{ cotizacion_id }}/estatus"
              hx-target="#cotizaciones-container"
              hx-swap="outerHTML"
              hx-on::after-request="if(event.detail.successful) document.getElementById('modal-aceptar-cotizacion')?.remove()"
              class="px-5 py-4 flex flex-col gap-4">

            <input type="hidden" name="estatus" value="ACEPTADA">
            <input type="hidden" name="estatus_filter" value="{{ estatus_filter }}">
            <input type="hidden" name="page" value="{{ page }}">

            {# Vigencia #}
            <div class="flex flex-col gap-3">
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Vigencia de la poliza</p>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">
                            Inicio <span class="text-red-500">*</span>
                        </label>
                        <input type="date" name="fecha_inicio_poliza"
                               x-model="fechaInicio"
                               required
                               class="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500">
                        <span x-show="fechaInicio" x-text="fechaInicio.split('-').reverse().join('/')" x-cloak
                              class="mt-1 block cursor-help text-xs text-gray-400"
                              title="Formato dia/mes/anio - puede no coincidir con el orden que muestra el calendario del navegador"></span>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">
                            Fin <span class="text-red-500">*</span>
                        </label>
                        <input type="date" name="fecha_fin_poliza"
                               x-model="fechaFin"
                               required
                               class="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500">
                        <span x-show="fechaFin" x-text="fechaFin.split('-').reverse().join('/')" x-cloak
                              class="mt-1 block cursor-help text-xs text-gray-400"
                              title="Formato dia/mes/anio - puede no coincidir con el orden que muestra el calendario del navegador"></span>
                    </div>
                </div>
            </div>

            {# Años contratados #}
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">
                    Años contratados <span class="text-red-500">*</span>
                </label>
                <div class="flex gap-2 flex-wrap">
                    {% for n in [1, 3, 5] %}
                    <label class="cursor-pointer">
                        <input type="radio" name="anios_contratados" value="{{ n }}" required
                               class="sr-only peer"
                               {{ 'checked' if n == 1 }}>
                        <div class="px-4 py-2 text-sm font-semibold rounded-lg border-2 transition-colors duration-150
                                    peer-checked:border-green-500 peer-checked:bg-green-50 peer-checked:text-green-700
                                    border-gray-200 text-gray-500 hover:border-green-300">
                            {{ n }} año{{ 's' if n > 1 else '' }}
                        </div>
                    </label>
                    {% endfor %}
                </div>
            </div>

        </form>

        {# Footer #}
        <div class="px-5 py-4 border-t border-gray-200 flex items-center justify-end gap-2">
            <button type="submit" form="form-aceptar-cotizacion"
                    class="bg-green-600 hover:bg-green-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
                <span class="htmx-indicator">
                    {{ spinner_icon('h-4 w-4', 'text-white') }}
                </span>
                Confirmar
            </button>
        </div>

    </div>
</div>
