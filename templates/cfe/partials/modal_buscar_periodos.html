{# templates/cfe/partials/modal_buscar_periodos.html #}
<div class="fixed inset-0 z-50 bg-gray-900 bg-opacity-60 backdrop-blur-sm flex items-center justify-center p-4"
     id="cfe-busqueda-modal">
    <div class="w-full max-w-2xl bg-white rounded-xl shadow-2xl">
        <div class="bg-yellow-700 px-6 py-4 rounded-t-xl flex items-center justify-between">
            <h3 class="text-lg font-bold text-white">Buscar periodos CFE</h3>
            <button type="button"
                    onclick="document.getElementById('cfe-modal-container').innerHTML=''"
                    class="text-white hover:text-yellow-100">
                <span class="sr-only">Cerrar</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div id="cfe-busqueda-body" class="p-6">
            <p class="text-sm text-gray-600 mb-4">
                Se buscaran y descargaran temporalmente los periodos disponibles para
                <strong>{{ servicio.nombre }}</strong>.
            </p>
            <form hx-post="/cfe/servicios/{{ servicio.id }}/buscar-periodos"
                  hx-target="#cfe-busqueda-body"
                  hx-swap="outerHTML"
                  class="space-y-4">
                <div>
                    <label for="cfe-max-periodos" class="block text-sm font-medium text-gray-700 mb-1">
                        Periodos a buscar
                    </label>
                    <input id="cfe-max-periodos" type="number" name="max_periodos"
                           value="12" min="1" max="60"
                           class="w-32 rounded-lg border-gray-300 text-sm focus:border-yellow-500 focus:ring-yellow-500">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button"
                            onclick="document.getElementById('cfe-modal-container').innerHTML=''"
                            class="px-4 py-2 text-sm text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50">
                        Cancelar
                    </button>
                    <button type="submit"
                            class="px-4 py-2 text-sm font-medium text-white bg-yellow-700 hover:bg-yellow-800 rounded-lg">
                        Buscar y descargar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
