{# templates/cfe/partials/modal_editar_servicio.html #}
<div class="fixed inset-0 z-50 bg-gray-900 bg-opacity-60 backdrop-blur-sm flex items-center justify-center p-4"
     id="cfe-editar-modal">
    <div class="w-full max-w-lg bg-white rounded-xl shadow-2xl">
        <div class="bg-teal-600 px-6 py-4 rounded-t-xl flex items-center justify-between">
            <h3 class="text-lg font-bold text-white">Editar Servicio CFE</h3>
            <button type="button" onclick="document.getElementById('cfe-modal-container').innerHTML=''"
                class="text-white/80 hover:text-white p-1 rounded">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <div class="px-6 pt-4">
            <div class="rounded-lg bg-red-50 border border-red-200 p-3 text-xs text-red-700">
                {{ servicio.miespacio_error or "No se pudo registrar el servicio en MiEspacio." }}
            </div>
        </div>

        <form hx-post="/cfe/servicios/{{ servicio.id }}/editar{% if modulo %}?modulo={{ modulo }}{% endif %}"
              hx-target="#cfe-lista"
              hx-swap="outerHTML"
              hx-on::after-request="if(event.detail.successful) document.getElementById('cfe-modal-container').innerHTML=''"
              class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Número de Servicio / RPU <span class="text-red-500">*</span></label>
                <input type="text" name="numero_servicio" required value="{{ servicio.numero_servicio }}"
                    class="w-full rounded-lg border-gray-300 px-3 py-2 focus:ring-teal-500 focus:border-teal-500 font-mono">
                <p class="text-xs text-gray-400 mt-1">Verifica el número exacto en tu recibo CFE.</p>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Nombre del servicio <span class="text-red-500">*</span></label>
                <input type="text" name="nombre" required value="{{ servicio.nombre }}"
                    class="w-full rounded-lg border-gray-300 px-3 py-2 uppercase focus:ring-teal-500 focus:border-teal-500">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Alias / Nombre corto</label>
                <input type="text" name="alias" value="{{ servicio.alias or '' }}"
                    class="w-full rounded-lg border-gray-300 px-3 py-2 focus:ring-teal-500 focus:border-teal-500">
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button type="button" onclick="document.getElementById('cfe-modal-container').innerHTML=''"
                    class="px-4 py-2 text-sm text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50">
                    Cancelar
                </button>
                <button type="submit"
                    class="px-4 py-2 text-sm font-medium text-white bg-teal-600 hover:bg-teal-700 rounded-lg">
                    Guardar y reintentar
                </button>
            </div>
        </form>
    </div>
</div>
