<div id="modal-reasignar"
    class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-[10010] p-4"
    x-data="{ loading: false }"
    @click.self="$el.remove()">

    <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm animate-scale-in" @click.stop>

        <div class="px-5 py-4 border-b border-gray-200 flex items-center justify-between">
            <h3 class="text-sm font-bold text-gray-900 flex items-center gap-2">
                <svg class="w-4 h-4 text-[#00BABB]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                Transferir oportunidad
            </h3>
            <button type="button" @click="$el.closest('#modal-reasignar').remove()"
                class="text-gray-400 hover:text-gray-600 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <form hx-post="/comercial/reasignar/{{ id_oportunidad }}"
            hx-target="body" hx-swap="beforeend"
            hx-indicator="#global-loading-overlay"
            x-on:submit="loading = true"
            hx-on::after-request="if(event.detail.successful){ $el.closest('#modal-reasignar').remove(); loading = false; } else { loading = false; }"
            class="p-5 space-y-4">

            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">
                    Asignar a
                </label>
                <select name="new_owner_id" required
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 focus:ring-2 focus:ring-[#00BABB] focus:border-[#00BABB] outline-none">
                    <option value="" disabled selected>Seleccionar usuario...</option>
                    {% for u in usuarios %}
                    <option value="{{ u.id_usuario }}">{{ u.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">
                    Motivo <span class="text-gray-400 font-normal normal-case">(opcional)</span>
                </label>
                <textarea name="motivo" rows="2" maxlength="500"
                    placeholder="Razón de la transferencia..."
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-800 focus:ring-2 focus:ring-[#00BABB] focus:border-[#00BABB] outline-none resize-none"></textarea>
            </div>

            <p class="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
                El usuario seleccionado será el nuevo responsable de esta oportunidad.
            </p>

            <div class="flex justify-end gap-2 pt-1">
                <button type="button" @click="$el.closest('#modal-reasignar').remove()"
                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                    Cancelar
                </button>
                <button type="submit" :disabled="loading"
                    class="px-4 py-2 text-sm font-bold text-white bg-[#00BABB] rounded-lg hover:bg-[#009899] transition disabled:opacity-60 flex items-center gap-2">
                    <svg x-show="loading" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
                    </svg>
                    <span x-text="loading ? 'Transfiriendo...' : 'Confirmar'"></span>
                </button>
            </div>
        </form>
    </div>
</div>
