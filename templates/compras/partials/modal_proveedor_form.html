{# Modal alta/edición de proveedor #}
{% set es_edicion = proveedor is defined and proveedor %}
<div id="modal-proveedor-overlay"
     class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-sm animate-fade-in">

    <div class="relative bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl w-full max-w-lg animate-slide-up sm:animate-scale-in"
         onclick="event.stopPropagation()">

        {# Header #}
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-[#00BABB]/10 flex items-center justify-center">
                    <svg class="h-4 w-4 text-[#00BABB]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-2 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                    </svg>
                </div>
                <h3 class="text-base font-bold text-gray-900">
                    {{ 'Editar Proveedor' if es_edicion else 'Nuevo Proveedor' }}
                </h3>
            </div>
            <button onclick="cerrarModalProveedor()" class="text-gray-400 hover:text-gray-600 transition-colors p-1 rounded-lg hover:bg-gray-100">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        {# Formulario #}
        <form id="form-proveedor"
              {% if es_edicion %}
              hx-patch="/compras/proveedores/{{ proveedor.id_proveedor }}"
              {% else %}
              hx-post="/compras/proveedores"
              {% endif %}
              hx-target="#proveedores-tabla-container"
              hx-swap="innerHTML"
              hx-on::after-request="if(event.detail.successful) cerrarModalProveedor()"
              class="px-6 py-5 space-y-4">

            {# RFC #}
            <div>
                <label for="prov-rfc" class="block text-sm font-medium text-gray-700 mb-1">
                    RFC <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                    <input type="text" id="prov-rfc" name="rfc"
                           value="{{ proveedor.rfc if es_edicion else '' }}"
                           required maxlength="13"
                           placeholder="XAXX010101000"
                           class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm font-mono uppercase focus:outline-none focus:ring-2 focus:ring-[#00BABB] transition-shadow"
                           oninput="this.value=this.value.toUpperCase()"
                           hx-get="/compras/proveedores/check-rfc"
                           hx-trigger="blur changed"
                           hx-include="this"
                           {% if es_edicion %}hx-vals='{"excluir_id": "{{ proveedor.id_proveedor }}"}'{% endif %}
                           hx-target="#rfc-validation"
                           hx-swap="innerHTML">
                    <div id="rfc-validation" class="mt-1 text-xs"></div>
                </div>
            </div>

            {# Razón Social #}
            <div>
                <label for="prov-razon" class="block text-sm font-medium text-gray-700 mb-1">
                    Razón Social <span class="text-red-500">*</span>
                </label>
                <input type="text" id="prov-razon" name="razon_social"
                       value="{{ proveedor.razon_social if es_edicion else '' }}"
                       required maxlength="300"
                       placeholder="Nombre legal completo del proveedor"
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#00BABB] transition-shadow">
            </div>

            {# Nombre Comercial #}
            <div>
                <label for="prov-comercial" class="block text-sm font-medium text-gray-700 mb-1">
                    Nombre Comercial
                    <span class="text-gray-400 font-normal">(opcional)</span>
                </label>
                <input type="text" id="prov-comercial" name="nombre_comercial"
                       value="{{ proveedor.nombre_comercial if es_edicion and proveedor.nombre_comercial else '' }}"
                       maxlength="200"
                       placeholder="Nombre con el que se conoce al proveedor"
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#00BABB] transition-shadow">
            </div>

            {# Error #}
            <div id="prov-form-error" class="hidden rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700"></div>

            {# Acciones #}
            <div class="flex justify-end gap-3 pt-2 border-t border-gray-100 mt-2">
                <button type="button" onclick="cerrarModalProveedor()"
                        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                    Cancelar
                </button>
                <button type="submit" id="btn-guardar-proveedor"
                        class="px-5 py-2 text-sm font-semibold text-white bg-[#00BABB] hover:bg-[#009999] rounded-lg transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    {{ 'Guardar cambios' if es_edicion else 'Crear proveedor' }}
                </button>
            </div>
        </form>
    </div>
</div>

<script>
(function () {
    // Mostrar error de respuesta HTMX en el form
    document.body.addEventListener('htmx:responseError', function (evt) {
        if (evt.detail.target && evt.detail.target.id === 'proveedores-tabla-container') {
            const errDiv = document.getElementById('prov-form-error');
            if (errDiv) {
                errDiv.textContent = evt.detail.xhr.responseText || 'Error al guardar el proveedor.';
                errDiv.classList.remove('hidden');
            }
        }
    });
})();
</script>
