<div id="sat-confirm-exceso-banner" hx-swap-oob="innerHTML">
  <div class="mx-0 mt-3 rounded-lg border border-amber-200 bg-amber-50 px-3 py-3 text-sm">
    <p class="font-semibold text-amber-800">Diferencia de montos detectada</p>
    <p class="mt-1 text-xs text-amber-700">{{ message }}</p>
    <p class="mt-1 text-xs text-amber-600">Si el diferencial es intencional (ej. descuento, redondeo), puedes confirmar de todos modos.</p>
    <form class="mt-2"
          hx-post="{{ action_url }}"
          hx-target="body"
          hx-swap="none">
      {% for inbox_id in inbox_ids %}
      <input type="hidden" name="inbox_ids" value="{{ inbox_id }}">
      {% endfor %}
      <input type="hidden" name="forzar_match" value="true">
      <button type="submit"
              class="px-3 py-1.5 text-xs font-medium text-white bg-amber-600 rounded-lg hover:bg-amber-700">
        Confirmar de todos modos
      </button>
    </form>
  </div>
</div>
