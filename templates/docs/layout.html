<!-- Layout Principal del Modal de Documentación -->
<!-- Este archivo define la estructura y el contenedor donde se cargará el contenido vía HTMX -->

<div x-data="{ 
    showModal: true, 
    activeTab: 'general',
    closeModal() {
        this.showModal = false;
        document.getElementById('main-content').style.overflow = 'auto';
        // Opcional: Eliminar del DOM después de cerrar para limpiar
        setTimeout(() => $el.remove(), 300);
    }
}" @keydown.escape.window="closeModal()" x-show="showModal" x-cloak
    x-init="document.getElementById('main-content').style.overflow = 'hidden'"
    class="fixed inset-0 z-[100] flex items-center justify-center bg-gray-900 bg-opacity-60 backdrop-blur-sm transition-opacity duration-300"
    x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">

    <!-- Modal Container -->
    <div @click.away="closeModal()"
        class="relative max-w-6xl w-full mx-4 bg-white rounded-xl shadow-2xl overflow-hidden transform transition-all duration-300 flex flex-col h-[85vh]"
        x-transition:enter="transition ease-out duration-300 delay-100"
        x-transition:enter-start="opacity-0 scale-95 translate-y-4"
        x-transition:enter-end="opacity-100 scale-100 translate-y-0"
        x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 scale-100"
        x-transition:leave-end="opacity-0 scale-95">

        <!-- Header Dynamic -->
        <div
            class="bg-gradient-to-r from-[#123456] to-[#0E2A47] text-white px-6 py-4 border-b border-[#00BABB] flex-shrink-0">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="bg-white/10 p-2 rounded-lg backdrop-blur-sm border border-white/20">
                        <span class="text-2xl">📚</span>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-white tracking-wide">Centro de Ayuda</h2>
                        <p class="text-xs text-blue-200 font-mono" x-data
                            x-text="'Módulo: ' + ($store.activeModule?.slug?.toUpperCase() || 'GENERAL')"></p>
                    </div>
                </div>
                <button @click="closeModal()"
                    class="text-white/60 hover:text-white hover:bg-white/10 rounded-lg p-2 transition-all duration-200 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Content Area (Cargado vía HTMX) -->
        <!-- NOTA: flex-1 permite que este div tome todo el espacio restante. 
             overflow-hidden previene scroll en el wrapper.
             El hijo #docs-content-container debe tener overflow-y-auto. -->
        <div class="flex-1 overflow-hidden relative bg-gray-50 min-h-0" x-data hx-get="/docs/content/"
            :hx-get="'/docs/content/' + ($store.activeModule?.slug || 'generic')" hx-trigger="load"
            hx-target="#docs-content-container" hx-swap="innerHTML">

            <!-- Container SCROLLABLE -->
            <div id="docs-content-container" class="h-full w-full overflow-y-auto custom-scrollbar">
                <!-- Loading State Default -->
                <div class="flex flex-col items-center justify-center h-64 text-gray-400 gap-3">
                    <div class="spinner-enertika"></div>
                    <p>Cargando documentación...</p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="bg-white px-6 py-3 border-t border-gray-200 flex justify-between items-center flex-shrink-0">
            <p class="text-xs text-gray-500">
                Enertika Core Ops v2.2 &bull; <a href="#" class="text-blue-600 hover:underline">Reportar un error en la
                    guía</a>
            </p>
            <button @click="closeModal()"
                class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-medium text-sm transition-colors duration-200">
                Cerrar
            </button>
        </div>
    </div>
</div>
