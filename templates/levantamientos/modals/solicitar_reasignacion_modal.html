<!-- Variables: lev_data, id_levantamiento -->
<div class="bg-white rounded-2xl shadow-2xl w-full max-w-md flex flex-col max-h-[90vh] mx-auto overflow-hidden animate-fade-in-up">

    <!-- Header -->
    <div class="bg-gradient-to-r from-amber-500 to-orange-500 p-4 flex-none flex justify-between items-center text-white relative overflow-hidden">
        <div class="absolute inset-0 bg-white/10 opacity-30 pattern-grid"></div>
        <h3 class="text-lg font-bold z-10 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-6 h-6">
                <path fill-rule="evenodd" d="M15.312 11.424a5.5 5.5 0 01-9.201 2.466l-.312-.311h2.433a.75.75 0 000-1.5H3.989a.75.75 0 00-.75.75v4.242a.75.75 0 001.5 0v-2.43l.31.31a7 7 0 0011.712-3.138.75.75 0 00-1.449-.39zm1.23-3.723a.75.75 0 00.219-.53V2.929a.75.75 0 00-1.5 0V5.36l-.31-.31A7 7 0 003.239 8.188a.75.75 0 101.448.389A5.5 5.5 0 0113.89 6.11l.311.31h-2.432a.75.75 0 000 1.5h4.243a.75.75 0 00.53-.219z" clip-rule="evenodd" />
            </svg>
            Solicitar Reasignación
        </h3>
        <button onclick="closeModal()"
            class="text-white/80 hover:text-white transition-colors z-10 rounded-full p-1 hover:bg-white/20">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <!-- Form -->
    <form
        hx-post="/levantamientos/solicitar-reasignacion/{{ id_levantamiento }}"
        hx-swap="none"
        hx-on::after-request="if(event.detail.successful) closeModal()"
        class="flex flex-col flex-1 overflow-hidden">

        <!-- Scrollable Body -->
        <div class="flex-1 overflow-y-auto p-6 bg-slate-50">

            <!-- Info del levantamiento -->
            <div class="bg-amber-50/60 rounded-xl p-3 mb-5 border border-amber-200/60">
                <h4 class="font-semibold text-amber-900 text-sm mb-1">{{ lev_data.nombre_proyecto or lev_data.titulo_proyecto }}</h4>
                <div class="flex items-center gap-3 text-xs text-amber-700/70">
                    <span>{{ lev_data.cliente_nombre }}</span>
                    <span class="text-amber-300">|</span>
                    <span>{{ lev_data.op_id_estandar }}</span>
                </div>
            </div>

            <!-- Aviso -->
            <div class="bg-blue-50 border border-blue-100 rounded-lg px-4 py-3 mb-5 text-xs text-blue-700 flex gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 flex-shrink-0 mt-0.5">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                </svg>
                <span>Se notificará al responsable de área y al solicitante del levantamiento para que gestionen la reasignación.</span>
            </div>

            <!-- Motivo -->
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">
                    Motivo de la solicitud <span class="text-red-500">*</span>
                </label>
                <textarea
                    name="motivo"
                    rows="4"
                    required
                    minlength="10"
                    placeholder="Explica por qué no puedes asistir a este levantamiento..."
                    class="w-full bg-white border border-gray-200 text-gray-700 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 shadow-sm resize-none text-sm placeholder-gray-300"></textarea>
                <p class="text-xs text-gray-400 mt-1">Mínimo 10 caracteres.</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="p-4 bg-white border-t border-gray-100 flex justify-end gap-3 flex-none shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20">
            <button type="button" onclick="closeModal()"
                class="px-4 py-2 bg-white text-gray-600 font-medium rounded-lg border border-gray-200 hover:bg-gray-50 hover:text-gray-800 transition-colors shadow-sm text-sm">
                Cancelar
            </button>
            <button type="submit"
                class="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-white font-semibold rounded-lg shadow-lg shadow-amber-500/30 transition-all transform hover:scale-[1.02] flex items-center gap-2 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4">
                    <path d="M3.105 2.289a.75.75 0 00-.826.95l1.414 4.925A1.5 1.5 0 005.135 9.25h6.115a.75.75 0 010 1.5H5.135a1.5 1.5 0 00-1.442 1.086l-1.414 4.926a.75.75 0 00.826.95 28.896 28.896 0 0015.293-7.154.75.75 0 000-1.115A28.897 28.897 0 003.105 2.289z" />
                </svg>
                Enviar Solicitud
            </button>
        </div>
    </form>
</div>
