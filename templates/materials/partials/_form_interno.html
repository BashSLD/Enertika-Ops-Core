<div>
    <label class="block text-xs font-medium text-gray-700 mb-1">Descripción canónica <span class="text-red-500">*</span></label>
    <input type="text" name="descripcion_canonica" x-model="form.descripcion_canonica" required
        autocomplete="off"
        {% if not modo_edicion|default(false) %}
        {% set similar_search_id = 'similar-search-material-form' %}
        {% include "materials/partials/_similar_internos_hx_attrs.html" %}
        {% endif %}
        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent"
        placeholder="Descripción oficial de la empresa">
    {% if not modo_edicion|default(false) %}
    <div class="material-similar-results mt-1 text-xs"></div>
    {% endif %}
</div>
<div class="border-t border-gray-100 pt-3">
    <p class="text-xs font-semibold text-gray-500 mb-2">Nomenclatura estructurada</p>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
        <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Tipo</label>
            <input type="text" name="tipo" x-model="form.tipo"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent"
                placeholder="Ej: CLIP">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Acabado</label>
            <input type="text" name="acabado" x-model="form.acabado"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent"
                placeholder="Ej: PARED DELGADA">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Marca</label>
            <input type="text" name="marca" x-model="form.marca"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Adicional</label>
            <input type="text" name="adicional" x-model="form.adicional"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Medida</label>
            <input type="text" name="medida" x-model="form.medida"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent"
                placeholder='Ej: (1/2")'>
        </div>
    </div>
</div>
<div class="grid grid-cols-2 gap-3">
    <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Unidad de medida</label>
        <select name="id_unidad_medida" x-model="form.id_unidad_medida"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent">
            <option value="">Sin unidad</option>
            {% for u in unidades %}
            <option value="{{ u.id }}">{{ u.codigo }} — {{ u.nombre }}</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Categoría</label>
        <select name="id_categoria" x-model="form.id_categoria"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent">
            <option value="">Sin categoría</option>
            {% for cat in categorias %}
            <option value="{{ cat.id }}">{{ cat.nombre }}</option>
            {% endfor %}
        </select>
    </div>
</div>
<div class="grid grid-cols-3 gap-3">
    <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Clave SAT</label>
        <input type="text" name="clave_prod_serv" x-model="form.clave_prod_serv" maxlength="10"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent"
            placeholder="Ej: 31191501">
    </div>
    <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Precio referencia</label>
        <input type="number" name="precio_referencia" x-model="form.precio_referencia"
            step="0.01" min="0"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent"
            placeholder="0.00">
    </div>
    <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Moneda</label>
        <select name="moneda" x-model="form.moneda"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent">
            <option value="MXN">MXN</option>
            <option value="USD">USD</option>
        </select>
    </div>
</div>
<div>
    <label class="block text-xs font-medium text-gray-700 mb-1">Notas</label>
    <textarea name="notas" x-model="form.notas" rows="2"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent resize-none"
        placeholder="Especificaciones, sinónimos, etc."></textarea>
</div>
