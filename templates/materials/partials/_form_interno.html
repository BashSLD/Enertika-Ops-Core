<div>
    <label class="block text-xs font-medium text-gray-700 mb-1">Descripción canónica <span class="text-red-500">*</span></label>
    <input type="text" name="descripcion_canonica" x-model="form.descripcion_canonica" required
        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent"
        placeholder="Descripción oficial de la empresa">
</div>
<div class="grid grid-cols-2 gap-3">
    <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Unidad de medida</label>
        <select name="id_unidad_medida" x-model="form.id_unidad_medida"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent">
            <option value="">Sin unidad</option>
            {% for u in unidades %}
            <option value="{{ u.id }}">{{ u.codigo }} — {{ u.nombre }}</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Categoría</label>
        <select name="id_categoria" x-model="form.id_categoria"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent">
            <option value="">Sin categoría</option>
            {% for cat in categorias %}
            <option value="{{ cat.id }}">{{ cat.nombre }}</option>
            {% endfor %}
        </select>
    </div>
</div>
<div class="grid grid-cols-2 gap-3">
    <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Clave SAT</label>
        <input type="text" name="clave_prod_serv" x-model="form.clave_prod_serv" maxlength="10"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent"
            placeholder="Ej: 31191501">
    </div>
    <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Precio referencia (MXN)</label>
        <input type="number" name="precio_referencia" x-model="form.precio_referencia"
            step="0.01" min="0"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent"
            placeholder="0.00">
    </div>
</div>
<div>
    <label class="block text-xs font-medium text-gray-700 mb-1">Notas</label>
    <textarea name="notas" x-model="form.notas" rows="2"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent resize-none"
        placeholder="Especificaciones, sinónimos, etc."></textarea>
</div>
