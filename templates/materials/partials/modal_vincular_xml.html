<div x-data="{ abierto: true }"
    class="modal-overlay-layer fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[85dvh] flex flex-col">
        <div class="flex items-center justify-between px-6 py-4 border-b flex-shrink-0">
            <div class="min-w-0">
                <h3 class="text-lg font-semibold text-[#123456]">Vínculos XML</h3>
                {% if interno %}
                <p class="text-xs font-semibold text-gray-700 truncate" title="{{ interno.descripcion_canonica }}">
                    {{ interno.descripcion_canonica }}
                </p>
                {% endif %}
            </div>
            <button @click="$el.closest('.fixed').remove()" class="text-gray-400 hover:text-gray-600 flex-shrink-0 ml-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <div class="flex-1 min-h-0 overflow-y-auto px-6 py-4 space-y-4">
            <!-- Búsqueda XML -->
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Buscar en historial XML para vincular</label>
                <input type="text" name="q" value="{{ q }}"
                    hx-get="/materials/internos/{{ interno_id }}/vincular-xml{{ '?origen_item_id=' ~ origen_item_id if origen_item_id else '' }}"
                    hx-target="#vincular-modal-content"
                    hx-swap="innerHTML"
                    hx-trigger="input[target.value.length==0 || target.value.length>=3] changed delay:350ms"
                    placeholder="Descripción del proveedor (mín. 3 caracteres)..."
                    autocomplete="off"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent">
            </div>

            <div id="vincular-modal-content">
                {% include "materials/partials/vincular_xml_resultados.html" %}
            </div>

            <!-- Vinculados actuales -->
            <div>
                <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-2">Actualmente vinculados</p>
                <div id="vinculos-list">
                    {% include "materials/partials/vinculos_xml_list.html" %}
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Puente entre este modal (apilado encima del modal de precios pendientes de
    // Compras via origen_item_id) y el formulario del modal que queda detras: al
    // vincular un XML con precio conocido, ofrece usarlo para completar
    // precio/moneda/checkbox del item pendiente en vez de dejar que el usuario lo
    // capture a mano dos veces.
    window.usarPrecioXmlPendiente = function (boton) {
        const itemId = boton.dataset.origenItemId;
        const precio = boton.dataset.precio;
        const moneda = boton.dataset.moneda || 'MXN';
        if (itemId && precio) {
            const usar = confirm('¿Usar el precio $' + precio + ' ' + moneda + ' de este XML para el item pendiente?');
            if (usar) {
                const precioInput = document.querySelector('[name="precio_unitario_' + itemId + '"]');
                const monedaSelect = document.querySelector('[name="moneda_' + itemId + '"]');
                const checkbox = document.querySelector('input[name="item_ids"][value="' + itemId + '"]');
                if (precioInput) precioInput.value = precio;
                if (monedaSelect) monedaSelect.value = moneda;
                if (checkbox) checkbox.checked = true;
            }
        }
        const modal = boton.closest('.modal-overlay-layer');
        if (modal) modal.remove();
    };
</script>
