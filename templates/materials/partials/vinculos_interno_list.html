{% if vinculos %}
<div class="space-y-1">
    {% for v in vinculos %}
    <div class="flex items-center justify-between p-2 rounded-lg bg-green-50 border border-green-100">
        <div class="flex-1 min-w-0">
            <div class="text-sm text-gray-800 truncate" title="{{ v.descripcion_canonica }}">
                {{ v.descripcion_canonica }}
            </div>
            <div class="text-xs text-gray-500">
                {{ v.categoria_nombre or '—' }} · {{ v.unidad or '—' }}
                {% if v.precio_referencia %} · ${{ "{:,.2f}".format(v.precio_referencia) }}{% endif %}
            </div>
        </div>
        <button
            hx-delete="/materials/{{ material_id }}/vincular-interno/{{ v.id_interno }}"
            hx-target="#vinculos-interno-list"
            hx-swap="innerHTML"
            class="ml-3 flex-shrink-0 text-xs text-red-500 hover:text-red-700 font-medium transition-colors">
            Quitar
        </button>
    </div>
    {% endfor %}
</div>
{% else %}
<p class="text-sm text-gray-400 text-center py-2">Sin vínculos aún</p>
{% endif %}
