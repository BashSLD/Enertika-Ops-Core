{% from "perfil/partials/_asistencia_row.html" import asistencia_row %}

{% for row in asistencia %}
{{ asistencia_row(row) }}
{% endfor %}

{% if tiene_mas %}
<div id="ver-mas-asistencia">
  <button
    hx-get="/perfil/asistencia/mas?offset={{ offset + 15 }}"
    hx-target="#ver-mas-asistencia"
    hx-swap="outerHTML"
    hx-indicator="#ver-mas-asistencia"
    class="w-full py-3 text-xs font-medium text-[#007C7D] hover:bg-gray-50 transition-colors">
    Ver más días
  </button>
</div>
{% endif %}
