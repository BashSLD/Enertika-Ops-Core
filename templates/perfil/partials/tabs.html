<div class="flex gap-1 border-b border-gray-200 mb-6 overflow-x-auto">
  <button @click="tab = 'asistencia'"
    hx-get="/perfil/asistencia" hx-target="#tab-content" hx-swap="innerHTML" hx-push-url="/perfil/ui?tab=asistencia"
    :class="{'border-b-2 border-[#00BABB] text-[#00BABB] font-semibold': tab === 'asistencia', 'text-gray-500 hover:text-gray-700': tab !== 'asistencia'}"
    class="inline-flex items-center gap-2 px-4 py-2.5 text-sm whitespace-nowrap transition-colors">
    <svg class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 6.75v5.5l3.25 2M12 3.75a8.25 8.25 0 1 1 0 16.5 8.25 8.25 0 0 1 0-16.5Z"/>
    </svg>
    Asistencia
  </button>
  <button @click="tab = 'vacaciones'"
    hx-get="/vacaciones/balance" hx-target="#tab-content" hx-swap="innerHTML" hx-push-url="/perfil/ui?tab=vacaciones"
    :class="{'border-b-2 border-[#00BABB] text-[#00BABB] font-semibold': tab === 'vacaciones', 'text-gray-500 hover:text-gray-700': tab !== 'vacaciones'}"
    class="inline-flex items-center gap-2 px-4 py-2.5 text-sm whitespace-nowrap transition-colors">
    <svg class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 2.75v3M16 2.75v3M4.75 9.25h14.5M6.75 4.75h10.5a2 2 0 0 1 2 2v10.5a2 2 0 0 1-2 2H6.75a2 2 0 0 1-2-2V6.75a2 2 0 0 1 2-2Z"/>
    </svg>
    Mis Vacaciones
  </button>
  <button @click="tab = 'solicitudes'"
    hx-get="/vacaciones/solicitudes" hx-target="#tab-content" hx-swap="innerHTML" hx-push-url="/perfil/ui?tab=solicitudes"
    :class="{'border-b-2 border-[#00BABB] text-[#00BABB] font-semibold': tab === 'solicitudes', 'text-gray-500 hover:text-gray-700': tab !== 'solicitudes'}"
    class="inline-flex items-center gap-2 px-4 py-2.5 text-sm whitespace-nowrap transition-colors">
    <svg class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 7.75h6M9 11.75h6M9 15.75h3M6.75 3.75h10.5a2 2 0 0 1 2 2v12.5a2 2 0 0 1-2 2H6.75a2 2 0 0 1-2-2V5.75a2 2 0 0 1 2-2Z"/>
    </svg>
    Solicitudes
  </button>
  {% if es_jefe_o_aprobador %}
  <button @click="tab = 'aprobaciones'"
    hx-get="/vacaciones/aprobaciones" hx-target="#tab-content" hx-swap="innerHTML" hx-push-url="/perfil/ui?tab=aprobaciones"
    :class="{'border-b-2 border-[#00BABB] text-[#00BABB] font-semibold': tab === 'aprobaciones', 'text-gray-500 hover:text-gray-700': tab !== 'aprobaciones'}"
    class="inline-flex items-center gap-2 px-4 py-2.5 text-sm whitespace-nowrap transition-colors">
    <svg class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="m8.75 12.5 2.25 2.25 4.25-5M12 3.75l6.25 2.75v4.9c0 3.85-2.57 7.35-6.25 8.43-3.68-1.08-6.25-4.58-6.25-8.43V6.5L12 3.75Z"/>
    </svg>
    Aprobaciones
    <span id="perfil-aprobaciones-badge" class="ml-1.5 rounded-full bg-amber-500 px-1.5 py-0.5 text-xs font-bold text-white {% if not pendientes_aprobaciones_count %}hidden{% endif %}">{{ pendientes_aprobaciones_count or "" }}</span>
  </button>
  <button @click="tab = 'equipo'"
    hx-get="/vacaciones/equipo" hx-target="#tab-content" hx-swap="innerHTML" hx-push-url="/perfil/ui?tab=equipo"
    :class="{'border-b-2 border-[#00BABB] text-[#00BABB] font-semibold': tab === 'equipo', 'text-gray-500 hover:text-gray-700': tab !== 'equipo'}"
    class="inline-flex items-center gap-2 px-4 py-2.5 text-sm whitespace-nowrap transition-colors">
    <svg class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16.25 18.75v-1.1a3.4 3.4 0 0 0-3.4-3.4h-4.2a3.4 3.4 0 0 0-3.4 3.4v1.1M13.75 7.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM18.75 18.75v-1.05a3 3 0 0 0-2.25-2.9M16.75 4.95a3 3 0 0 1 0 5.6"/>
    </svg>
    Mi equipo
  </button>
  {% endif %}
  <button @click="tab = 'firma'"
    hx-get="/perfil/firma" hx-target="#tab-content" hx-swap="innerHTML" hx-push-url="/perfil/ui?tab=firma"
    :class="{'border-b-2 border-[#00BABB] text-[#00BABB] font-semibold': tab === 'firma', 'text-gray-500 hover:text-gray-700': tab !== 'firma'}"
    class="inline-flex items-center gap-2 px-4 py-2.5 text-sm whitespace-nowrap transition-colors">
    <svg class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16.75 4.75 19.25 7.25 9.25 17.25l-3.5.75.75-3.5 10.25-9.75ZM4.75 20.25h14.5"/>
    </svg>
    Mi Firma
  </button>
</div>
