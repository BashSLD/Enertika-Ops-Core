{# templates/proyectos/partials/visita_obra_modal.html #}
<div id="modal-visita-obra" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"
    x-data="{
        form: {
            nombre_planta: '',
            id_proyecto: '',
            ubicacion: '',
            persona_responsable_interna: '',
            responsable_obra: '',
            numero_visita: 1,
            fecha: '',
            hora_entrada: '',
            hora_salida: '',
            motivo_visita: '',
            avances_conforme_cronograma: true,
            razon_no_conforme: '',
            acuerdos: '',
            lugar_elaboracion: ''
        },
        archivos: [],
        dragging: false,
        generando: false,
        errors: {},

        get totalFotos() { return this.archivos.length; },

        onFileChange(e) {
            const nuevos = Array.from(e.target.files);
            this.archivos = [...this.archivos, ...nuevos];
            e.target.value = '';
        },

        onDrop(e) {
            this.dragging = false;
            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
            this.archivos = [...this.archivos, ...files];
        },

        quitarFoto(idx) { this.archivos.splice(idx, 1); },

        validate() {
            const e = {};
            if (!this.form.nombre_planta.trim()) e.nombre_planta = 'Requerido';
            if (!this.form.id_proyecto.trim()) e.id_proyecto = 'Requerido';
            if (!this.form.persona_responsable_interna.trim()) e.persona_responsable_interna = 'Requerido';
            if (!this.form.responsable_obra.trim()) e.responsable_obra = 'Requerido';
            if (!this.form.numero_visita || this.form.numero_visita < 1) e.numero_visita = 'Debe ser >= 1';
            if (!this.form.hora_entrada.trim()) e.hora_entrada = 'Requerido';
            if (!this.form.hora_salida.trim()) e.hora_salida = 'Requerido';
            if (!this.form.motivo_visita.trim()) e.motivo_visita = 'Requerido';
            if (!this.form.avances_conforme_cronograma && !this.form.razon_no_conforme.trim())
                e.razon_no_conforme = 'Explica la razon de no conformidad';
            this.errors = e;
            return Object.keys(e).length === 0;
        },

        async generar() {
            if (!this.validate()) return;
            this.generando = true;
            try {
                const fd = new FormData();
                fd.append('data', JSON.stringify(this.form));
                this.archivos.forEach(f => fd.append('images', f));

                const resp = await fetch('/pdf/visita-obra/generar', { method: 'POST', body: fd });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    throw new Error(err.error || 'Error generando PDF');
                }
                const blob = await resp.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `visita_obra_${this.form.nombre_planta || 'reporte'}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                this.cerrar();
            } catch(e) {
                alert('Error: ' + e.message);
            } finally {
                this.generando = false;
            }
        },

        cerrar() {
            document.getElementById('modal-visita-obra').remove();
        }
    }" @keydown.escape.window="cerrar()">
    <!-- Panel -->
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl mx-3 max-h-[90vh] flex flex-col">

        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 shrink-0">
            <div>
                <h2 class="text-lg font-semibold text-gray-900">Formato de Visita a Obra</h2>
                <p class="text-xs text-gray-500 mt-0.5">Completa los datos para generar el PDF</p>
            </div>
            <button @click="cerrar()" class="text-gray-400 hover:text-gray-600 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Body — scrollable -->
        <div class="overflow-y-auto flex-1 px-6 py-5 space-y-5">

            <!-- Datos Generales -->
            <div>
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Datos Generales</h3>
                <div class="grid grid-cols-2 gap-4">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de la planta <span
                                class="text-red-500">*</span></label>
                        <input type="text" x-model="form.nombre_planta"
                            class="w-full text-sm border rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#00BABB] focus:border-[#00BABB]"
                            :class="errors.nombre_planta ? 'border-red-400' : 'border-gray-300'"
                            placeholder="Ej. Planta Solar Norte">
                        <p x-show="errors.nombre_planta" x-text="errors.nombre_planta"
                            class="text-red-500 text-xs mt-1"></p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ID de Proyecto <span
                                class="text-red-500">*</span></label>
                        <input type="text" x-model="form.id_proyecto"
                            class="w-full text-sm border rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#00BABB] focus:border-[#00BABB]"
                            :class="errors.id_proyecto ? 'border-red-400' : 'border-gray-300'"
                            placeholder="Ej. MX-50055-FV">
                        <p x-show="errors.id_proyecto" x-text="errors.id_proyecto" class="text-red-500 text-xs mt-1">
                        </p>
                    </div>

                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ubicacion</label>
                        <input type="text" x-model="form.ubicacion"
                            class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#00BABB] focus:border-[#00BABB]"
                            placeholder="Ciudad, Estado">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Responsable interno <span
                                class="text-red-500">*</span></label>
                        <input type="text" x-model="form.persona_responsable_interna"
                            class="w-full text-sm border rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#00BABB] focus:border-[#00BABB]"
                            :class="errors.persona_responsable_interna ? 'border-red-400' : 'border-gray-300'"
                            placeholder="Nombre completo">
                        <p x-show="errors.persona_responsable_interna" x-text="errors.persona_responsable_interna"
                            class="text-red-500 text-xs mt-1"></p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Responsable de obra <span
                                class="text-red-500">*</span></label>
                        <input type="text" x-model="form.responsable_obra"
                            class="w-full text-sm border rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#00BABB] focus:border-[#00BABB]"
                            :class="errors.responsable_obra ? 'border-red-400' : 'border-gray-300'"
                            placeholder="Nombre completo">
                        <p x-show="errors.responsable_obra" x-text="errors.responsable_obra"
                            class="text-red-500 text-xs mt-1"></p>
                    </div>

                </div>
            </div>

            <!-- Datos de la Visita -->
            <div>
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Datos de la Visita</h3>
                <div class="grid grid-cols-2 gap-4">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">No. de Visita <span
                                class="text-red-500">*</span></label>
                        <input type="number" x-model.number="form.numero_visita" min="1"
                            class="w-full text-sm border rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#00BABB] focus:border-[#00BABB]"
                            :class="errors.numero_visita ? 'border-red-400' : 'border-gray-300'">
                        <p x-show="errors.numero_visita" x-text="errors.numero_visita"
                            class="text-red-500 text-xs mt-1"></p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
                        <input type="date" x-model="form.fecha" :max="new Date().toLocaleDateString('en-CA')"
                            class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#00BABB] focus:border-[#00BABB]">
                        <p class="text-xs text-gray-400 mt-1">Opcional — se usa la fecha de hoy si se deja vacio</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Hora entrada <span
                                class="text-red-500">*</span></label>
                        <input type="time" x-model="form.hora_entrada"
                            class="w-full text-sm border rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#00BABB] focus:border-[#00BABB]"
                            :class="errors.hora_entrada ? 'border-red-400' : 'border-gray-300'">
                        <p x-show="errors.hora_entrada" x-text="errors.hora_entrada" class="text-red-500 text-xs mt-1">
                        </p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Hora salida <span
                                class="text-red-500">*</span></label>
                        <input type="time" x-model="form.hora_salida"
                            class="w-full text-sm border rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#00BABB] focus:border-[#00BABB]"
                            :class="errors.hora_salida ? 'border-red-400' : 'border-gray-300'">
                        <p x-show="errors.hora_salida" x-text="errors.hora_salida" class="text-red-500 text-xs mt-1">
                        </p>
                    </div>

                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Motivo de visita <span
                                class="text-red-500">*</span></label>
                        <textarea x-model="form.motivo_visita" rows="3"
                            class="w-full text-sm border rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#00BABB] focus:border-[#00BABB] resize-none"
                            :class="errors.motivo_visita ? 'border-red-400' : 'border-gray-300'"
                            placeholder="Describe el motivo de esta visita..."></textarea>
                        <p x-show="errors.motivo_visita" x-text="errors.motivo_visita"
                            class="text-red-500 text-xs mt-1"></p>
                    </div>

                    <!-- Avances conforme cronograma -->
                    <div class="col-span-2">
                        <div class="flex items-center gap-3">
                            <button type="button"
                                @click="form.avances_conforme_cronograma = !form.avances_conforme_cronograma"
                                class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200"
                                :class="form.avances_conforme_cronograma ? 'bg-green-500' : 'bg-red-400'">
                                <span
                                    class="inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200"
                                    :class="form.avances_conforme_cronograma ? 'translate-x-5' : 'translate-x-0'"></span>
                            </button>
                            <span class="text-sm font-medium text-gray-700">Avances conforme al cronograma</span>
                            <span class="text-sm"
                                :class="form.avances_conforme_cronograma ? 'text-green-600' : 'text-red-500'"
                                x-text="form.avances_conforme_cronograma ? 'Si' : 'No'"></span>
                        </div>
                    </div>

                    <div class="col-span-2" x-show="!form.avances_conforme_cronograma" x-cloak>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Razon de no conformidad <span
                                class="text-red-500">*</span></label>
                        <textarea x-model="form.razon_no_conforme" rows="2"
                            class="w-full text-sm border rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#00BABB] focus:border-[#00BABB] resize-none"
                            :class="errors.razon_no_conforme ? 'border-red-400' : 'border-gray-300'"
                            placeholder="Explica la razon..."></textarea>
                        <p x-show="errors.razon_no_conforme" x-text="errors.razon_no_conforme"
                            class="text-red-500 text-xs mt-1"></p>
                    </div>

                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Acuerdos</label>
                        <textarea x-model="form.acuerdos" rows="2"
                            class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#00BABB] focus:border-[#00BABB] resize-none"
                            placeholder="Acuerdos y compromisos de la visita..."></textarea>
                    </div>

                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Lugar de elaboracion</label>
                        <input type="text" x-model="form.lugar_elaboracion"
                            class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#00BABB] focus:border-[#00BABB]"
                            placeholder="Ej. Oficina Central, CDMX">
                    </div>

                </div>
            </div>

            <!-- Evidencia Fotografica -->
            <div>
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">
                    Evidencia Fotografica
                    <span class="ml-2 px-2 py-0.5 bg-gray-100 rounded-full text-gray-600 font-normal normal-case"
                        x-text="totalFotos + ' foto' + (totalFotos !== 1 ? 's' : '')"></span>
                </h3>

                <!-- Drag & Drop upload area -->
                <div class="relative" @dragover.prevent="dragging = true" @dragleave.prevent="dragging = false"
                    @drop.prevent="onDrop($event)">
                    <label
                        class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-lg cursor-pointer transition-all duration-200"
                        :class="dragging
                            ? 'border-[#00BABB] bg-teal-50 scale-[1.01] shadow-lg shadow-teal-100'
                            : 'border-gray-300 hover:border-[#00BABB] hover:bg-teal-50'">
                        <svg class="w-8 h-8 mb-2 transition-colors"
                            :class="dragging ? 'text-[#00BABB]' : 'text-gray-400'" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <span class="text-sm font-medium" :class="dragging ? 'text-[#00BABB]' : 'text-gray-500'"
                            x-text="dragging ? 'Suelta las fotos aqui' : 'Arrastra fotos aqui o haz clic para seleccionar'"></span>
                        <span class="text-xs text-gray-400 mt-1" x-show="!dragging">JPG, PNG, WebP</span>
                        <input type="file" accept="image/jpeg,image/jpg,image/png,image/webp" multiple class="hidden"
                            @change="onFileChange($event)">
                    </label>
                </div>

                <!-- Thumbnails grid -->
                <template x-if="totalFotos > 0">
                    <div class="mt-3 grid grid-cols-4 gap-2">
                        <template x-for="(f, idx) in archivos" :key="idx">
                            <div
                                class="relative group rounded-lg overflow-hidden border border-gray-200 bg-gray-50 aspect-square">
                                <img :src="URL.createObjectURL(f)" class="w-full h-full object-cover" :alt="f.name">
                                <!-- Overlay on hover -->
                                <div
                                    class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center">
                                    <button type="button" @click="quitarFoto(idx)"
                                        class="p-1.5 bg-red-500 rounded-full text-white hover:bg-red-600 transition-colors">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                    <span class="text-white text-[10px] mt-1 truncate max-w-full px-1"
                                        x-text="f.name"></span>
                                </div>
                                <!-- Size badge -->
                                <span
                                    class="absolute bottom-1 right-1 text-[9px] bg-black/60 text-white px-1.5 py-0.5 rounded"
                                    x-text="(f.size / 1024 / 1024).toFixed(1) + ' MB'"></span>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

        </div>

        <!-- Footer -->
        <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200 shrink-0">
            <button type="button" @click="cerrar()"
                class="px-4 py-2 text-sm text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                Cancelar
            </button>
            <button type="button" @click="generar()" :disabled="generando"
                class="flex items-center gap-2 px-5 py-2 text-sm font-medium text-white bg-[#00BABB] rounded-lg hover:bg-[#009a9b] transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
                <svg class="w-4 h-4" :class="{'animate-spin': generando}" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span x-text="generando ? 'Generando PDF...' : 'Generar PDF'"></span>
            </button>
        </div>

    </div>
</div>
