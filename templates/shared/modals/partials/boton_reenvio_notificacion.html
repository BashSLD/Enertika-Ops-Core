<div id="boton-reenvio-container">
    {% if notificacion_ganada_at %}
    <p class="text-xs text-gray-500 mb-2">
        Ultimo envio: {{ notificacion_ganada_at | time_mx }}
    </p>
    {% endif %}

    {% if tiene_proyecto %}
    <button
        type="button"
        disabled
        title="El proyecto ya fue creado"
        class="inline-flex items-center gap-2 px-4 py-2 bg-gray-100 text-gray-400 border border-gray-200 rounded-lg text-sm font-medium cursor-not-allowed opacity-60">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
        Reenviar Recordatorio
    </button>
    <p class="text-xs text-gray-400 mt-1">El proyecto ya fue creado en Projects Gate.</p>
    {% else %}
    <button
        type="button"
        hx-post="/comercial/reenviar-notificacion-ganada/{{ id_oportunidad }}"
        hx-target="#boton-reenvio-container"
        hx-swap="outerHTML"
        hx-disabled-elt="this"
        class="inline-flex items-center gap-2 px-4 py-2 bg-white hover:bg-green-50 text-green-700 border border-green-200 rounded-lg text-sm font-medium shadow-sm transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
        Reenviar Recordatorio
    </button>
    {% endif %}
</div>

{% if toast %}
{% include "shared/toast.html" %}
{% endif %}
