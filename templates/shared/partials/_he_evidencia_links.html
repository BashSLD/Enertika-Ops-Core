{% macro he_evidencia_links(evidencias) %}
{% if evidencias %}
<div class="mt-1 flex flex-wrap gap-1.5">
  {% for ev in evidencias %}
  <a href="/asistencia/evidencias/{{ ev.id_documento }}/preview" target="_blank"
     class="inline-flex items-center gap-1 rounded-lg border border-gray-300 bg-white px-2.5 py-1 text-xs font-semibold text-gray-600 hover:border-[#00BABB] hover:bg-[#00BABB]/5 hover:text-[#007C7D] transition-colors">
    <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.485 8.486L20.5 13"/>
    </svg>
    Evidencia {{ loop.index }}
  </a>
  {% endfor %}
</div>
{% endif %}
{% endmacro %}
