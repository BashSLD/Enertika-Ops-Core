{% macro pager_cursor(pagina, tiene_siguiente, endpoint, hx_target) %}
{% if pagina > 1 or tiene_siguiente %}
<div class="flex items-center justify-between border-t border-gray-100 px-5 py-3">
  {% if pagina > 1 %}
  <button
    hx-get="{{ endpoint }}?pagina={{ pagina - 1 }}"
    hx-target="{{ hx_target }}"
    hx-swap="innerHTML"
    class="inline-flex items-center gap-1.5 rounded-lg border border-gray-200 px-3 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-50 transition-colors">
    <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.75 19.5 8.25 12l7.5-7.5"/>
    </svg>
    Anterior
  </button>
  {% else %}
  <span></span>
  {% endif %}

  <span class="text-xs text-gray-400">Página {{ pagina }}</span>

  {% if tiene_siguiente %}
  <button
    hx-get="{{ endpoint }}?pagina={{ pagina + 1 }}"
    hx-target="{{ hx_target }}"
    hx-swap="innerHTML"
    class="inline-flex items-center gap-1.5 rounded-lg border border-gray-200 px-3 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-50 transition-colors">
    Siguiente
    <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m8.25 4.5 7.5 7.5-7.5 7.5"/>
    </svg>
  </button>
  {% else %}
  <span></span>
  {% endif %}
</div>
{% endif %}
{% endmacro %}
