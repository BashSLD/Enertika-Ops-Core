{# Overlay de carga (spinner) para contenedores con hx-indicator. #}
{% macro spinner_overlay(id) %}
<div id="{{ id }}" class="htmx-indicator absolute inset-0 z-20 flex items-center justify-center bg-white/70 rounded-xl">
    <svg class="w-8 h-8 animate-spin text-blue-600" fill="none" viewBox="0 0 24 24" aria-hidden="true">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
    </svg>
</div>
{% endmacro %}
