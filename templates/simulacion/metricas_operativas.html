<div class="container mx-auto p-6" x-data="{ loading: false }">

    <!-- Header con navegación -->
    <div class="mb-4">
        <div class="flex items-center gap-2 text-sm text-gray-500 mb-2">
            <a href="#" hx-get="/simulacion/ui" hx-target="#main-content" hx-push-url="true"
                class="hover:text-indigo-600 transition-colors">Simulación</a>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
            <span class="text-gray-700 font-medium">Métricas Operativas</span>
        </div>
        <h1 class="text-xl font-bold text-gray-900">Métricas Operativas - Simulación</h1>
        <p class="text-sm text-gray-500 mt-1">Análisis de tiempos entre estatus y cuellos de botella</p>
    </div>

    <!-- Barra de filtros (popover compacto) -->
    <div class="flex items-center justify-end gap-3 mb-6">
        <!-- Loading indicator -->
        <div id="loading" class="htmx-indicator">
            <div class="flex items-center gap-2">
                <div class="spinner-enertika w-4 h-4"></div>
                <span class="text-sm text-gray-500">Cargando...</span>
            </div>
        </div>

        <div class="relative"
            x-data="{ open: false, active: 0, recount(f) { this.active = [...f.elements].filter(e => e.name && e.value).length } }"
            @keydown.escape.window="open = false">
            <button type="button" @click="open = !open"
                class="inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 transition-colors">
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z">
                    </path>
                </svg>
                Filtros
                <span x-show="active > 0" x-cloak x-text="active"
                    class="inline-flex items-center justify-center min-w-[1.25rem] h-5 px-1 text-xs font-semibold rounded-full bg-indigo-600 text-white"></span>
                <svg class="w-3 h-3 text-gray-400 transition-transform" :class="{ 'rotate-180': open }"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>

            <!-- Panel desplegable -->
            <div x-show="open" x-cloak x-transition @click.outside="open = false"
                class="absolute right-0 mt-2 w-72 bg-white rounded-lg shadow-lg border border-gray-200 p-4 z-30">
                <form hx-get="/simulacion/api/metricas-operativas/datos" hx-target="#metricas-content"
                    hx-indicator="#loading" hx-swap="innerHTML"
                    x-init="recount($el)" @change="recount($el)"
                    @submit="open = false" class="space-y-3">

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Fecha Inicio</label>
                        <input type="date" name="fecha_inicio" value="{{ rango_inicio }}"
                            class="w-full border border-gray-300 rounded-lg px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Fecha Fin</label>
                        <input type="date" name="fecha_fin" value="{{ rango_fin }}"
                            class="w-full border border-gray-300 rounded-lg px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Responsable</label>
                        <select name="user_id"
                            class="w-full border border-gray-300 rounded-lg px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
                            <option value="">Todos</option>
                            {% for usuario in usuarios %}
                            <option value="{{ usuario.id }}">{{ usuario.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Tipo Solicitud</label>
                        <select name="tipo_solicitud"
                            class="w-full border border-gray-300 rounded-lg px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
                            <option value="">Todos</option>
                            {% for tipo in tipos_solicitud %}
                            <option value="{{ tipo.id }}">{{ tipo.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Tecnología</label>
                        <select name="tecnologia"
                            class="w-full border border-gray-300 rounded-lg px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
                            <option value="">Todas</option>
                            {% for tec in tecnologias %}
                            <option value="{{ tec.id }}">{{ tec.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="flex justify-end gap-2 pt-1 border-t border-gray-100">
                        <button type="button"
                            @click="const f = $el.closest('form'); f.reset(); recount(f)"
                            class="px-3 py-1.5 text-sm bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
                            Limpiar
                        </button>
                        <button type="submit"
                            class="px-3 py-1.5 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
                            Aplicar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Contenido de Métricas (carga dinámica) -->
    <div id="metricas-content" hx-get="/simulacion/api/metricas-operativas/datos" hx-trigger="load"
        hx-indicator="#loading">
        <!-- Loading inicial -->
        <div class="flex justify-center items-center py-12">
            <div class="text-center">
                <div class="spinner-enertika mx-auto mb-4"></div>
                <p class="text-indigo-600 font-medium animate-pulse">Cargando métricas operativas...</p>
            </div>
        </div>
    </div>

</div>
