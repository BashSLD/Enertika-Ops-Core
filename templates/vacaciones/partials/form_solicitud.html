<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 max-w-lg"
     data-tipos='{{ tipos | tojson }}'
     data-saldo-disponible="{{ balance.total_disponible }}"
     x-data="{
       tipoSlug: '',
       afectaSaldo: false,
       fechaInicio: '',
       fechaFin: '',
       diasHabiles: 0,
       diasCalculados: false,
       fechaPresentarse: '',
       fechaPresentarseCalculada: '',
       saldoDisponible: 0,
       tipos: [],
       _calcularCtrl: null,
       init() {
         this.tipos = JSON.parse(this.$el.dataset.tipos || '[]');
         this.saldoDisponible = parseInt(this.$el.dataset.saldoDisponible || '0');
       },
       async calcularDias() {
         if (this._calcularCtrl) this._calcularCtrl.abort();
         this._calcularCtrl = new AbortController();
         this.diasCalculados = false;
         if (!this.fechaInicio || !this.fechaFin) {
           this.diasHabiles = 0;
           this.fechaPresentarseCalculada = '';
           this.fechaPresentarse = '';
           return;
         }
         try {
           const r = await fetch('/vacaciones/calcular-dias?inicio=' + this.fechaInicio + '&fin=' + this.fechaFin, { signal: this._calcularCtrl.signal });
           if (r.ok) {
             const d = await r.json();
             this.diasHabiles = d.dias;
             this.fechaPresentarseCalculada = d.fecha_presentarse || '';
             this.fechaPresentarse = d.fecha_presentarse || '';
             this.diasCalculados = true;
           }
         } catch (e) {
           if (e.name !== 'AbortError') throw e;
         }
       },
       get sinDiasHabiles() {
         return this.fechaInicio && this.fechaFin && this.diasCalculados && this.diasHabiles === 0;
       },
       get discrepanciaFecha() {
         return this.fechaPresentarse && this.fechaPresentarseCalculada && this.fechaPresentarse !== this.fechaPresentarseCalculada;
       },
       formatFecha(iso) {
         if (!iso) return '';
         const [y, m, d] = iso.split('-');
         return d + '/' + m + '/' + y;
       }
     }">

  <h2 class="text-lg font-bold text-gray-900 mb-5">Nueva Solicitud</h2>

  {% if not tiene_firma %}
  <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 mb-4 text-sm text-amber-800">
    No tienes firma registrada. Se te pedirá que la crees al enviar la solicitud.
  </div>
  {% endif %}

  <form hx-post="/vacaciones/solicitudes"
        hx-target="#tab-content"
        hx-swap="innerHTML"
        hx-disabled-elt="find button[type='submit']"
        class="space-y-4">

    <!-- Tipo -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de solicitud *</label>
      <select name="tipo_ausencia_id" required
              @change="const t = tipos.find(x => x.id == $event.target.value); tipoSlug = t ? t.slug : ''; afectaSaldo = t ? t.afecta_saldo : false"
              class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent outline-none">
        <option value="">Selecciona un tipo...</option>
        {% for t in tipos %}
        <option value="{{ t.id }}">{{ t.nombre }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Fechas -->
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Fecha inicio *</label>
        <input type="date" name="fecha_inicio" required
               x-model="fechaInicio"
               @change="calcularDias()"
               class="w-full rounded-lg border-gray-300 text-sm focus:border-[#00BABB] focus:ring-[#00BABB]">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Fecha fin *</label>
        <input type="date" name="fecha_fin" required
               x-model="fechaFin"
               @change="calcularDias()"
               class="w-full rounded-lg border-gray-300 text-sm focus:border-[#00BABB] focus:ring-[#00BABB]">
      </div>
    </div>

    <!-- Días solicitados -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Días solicitados</label>
      <input type="number" readonly
             :value="diasHabiles || ''"
             placeholder="Se calcula con las fechas"
             class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm bg-gray-50 text-gray-700 focus:ring-2 focus:ring-[#00BABB] focus:border-transparent outline-none">
      <p class="text-xs text-gray-400 mt-1">Solo días hábiles (L–V, sin festivos ni fines de semana).</p>
      <template x-if="sinDiasHabiles">
        <p class="text-red-600 text-xs mt-1 font-medium">
          El rango seleccionado no contiene días hábiles. Ajusta las fechas para enviar la solicitud.
        </p>
      </template>
      <template x-if="afectaSaldo && saldoDisponible > 0 && diasHabiles > saldoDisponible">
        <p class="text-amber-600 text-xs mt-1 font-medium">Superarás tu saldo disponible (<span x-text="saldoDisponible"></span> días).</p>
      </template>
    </div>

    <!-- Fecha de presentarse -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de regreso</label>
      <input type="date" name="fecha_presentarse"
             x-model="fechaPresentarse"
             class="w-full rounded-lg border-gray-300 text-sm focus:border-[#00BABB] focus:ring-[#00BABB]">
      <template x-if="discrepanciaFecha">
        <p class="text-amber-600 text-xs mt-1 font-medium">
          El siguiente día hábil sugerido es <span x-text="formatFecha(fechaPresentarseCalculada)"></span>. Puedes mantener tu selección si es correcto.
        </p>
      </template>
    </div>

    <!-- Observaciones -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Observaciones</label>
      <textarea name="observaciones" rows="2" placeholder="Opcional..."
                class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-[#00BABB] focus:border-transparent outline-none resize-none"></textarea>
    </div>

    <!-- Acciones -->
    <div class="flex gap-3 pt-2">
      <button type="button"
              @click="$dispatch('cerrar-modal-solicitud')"
              class="flex-1 border border-gray-200 text-gray-700 text-sm font-medium py-2.5 rounded-xl hover:bg-gray-50 transition-colors">
        Cancelar
      </button>
      <button type="submit"
              :disabled="sinDiasHabiles"
              :class="sinDiasHabiles ? 'bg-gray-300 cursor-not-allowed hover:bg-gray-300' : 'bg-[#00BABB] hover:bg-[#009A9B]'"
              class="flex-1 text-white text-sm font-semibold py-2.5 rounded-xl transition-colors">
        Enviar solicitud
      </button>
    </div>
  </form>
</div>
